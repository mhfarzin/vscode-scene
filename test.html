<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code Screensaver — Standalone Test</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            width: 100%;
            height: 100%;
        }
        .container {
            width: 100%;
            height: 100%;
        }
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
    </div>
    <script>
        // ===== Reads the screen from the query string: ?screen=stars | ?screen=sky-pilot =====
        (function () {
            const params = new URLSearchParams(window.location.search);
            const screen = params.get('screen') || 'stars';

            // Valid types (mirrors src/host/ScreensaverPanel.ts VALID_SCREEN_TYPES)
            const valid = ['stars', 'sky-pilot'];
            window.__SCREEN_TYPE__ = valid.includes(screen) ? screen : 'stars';

            // Assets folder — used by screens that load images (owl, planes).
            // './assets/' works for both file:// and http:// serving.
            window.__ASSETS_BASE_URI__ = new URL('./assets/', window.location.href).href;
        })();
    </script>
    <!-- Load the REAL compiled webview bundle -->
    <script src="dist/panel.js"></script>
</body>
</html>
